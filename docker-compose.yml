services:
  mcpserver:
    build:
      context: .
      dockerfile: Dockerfile
      target: mcpserver
    container_name: agenticlab-mcpserver
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
    networks:
      - agenticlab

  aiservice:
    build:
      context: .
      dockerfile: Dockerfile
      target: aiservice
    container_name: agenticlab-aiservice
    ports:
      - "127.0.0.1:8083:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # This fork is built around Copilot 365; set Examples__copilot365__Enabled=false in .env to hide it.
      - Examples__copilot365__Enabled=${Examples__copilot365__Enabled:-true}
      - ASPNETCORE_HTTP_PORTS=8080
      - Models__Provider=${Models__Provider:-AzureOpenAI}
      - AzureOpenAI__Endpoint=${AzureOpenAI__Endpoint:-}
      - AzureOpenAI__Deployment=${AzureOpenAI__Deployment:-}
      - AzureOpenAI__ApiKey=${AzureOpenAI__ApiKey:-}
      - OpenAI__ApiKey=${OpenAI__ApiKey:-}
      - OpenAI__Model=${OpenAI__Model:-}
      - Gemini__ApiKey=${Gemini__ApiKey:-}
      - Gemini__Model=${Gemini__Model:-}
      - Bedrock__Model=${Bedrock__Model:-}
      - Bedrock__Region=${Bedrock__Region:-}
      - Bedrock__ApiKey=${Bedrock__ApiKey:-}
      # Pass-through: unset in the shell means unset in the container, never an empty credential.
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - services__mcpserver__http__0=http://mcpserver:8080
    networks:
      - agenticlab
    depends_on:
      - mcpserver

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: agenticlab-web
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # This fork is built around Copilot 365; set Examples__copilot365__Enabled=false in .env to hide it.
      - Examples__copilot365__Enabled=${Examples__copilot365__Enabled:-true}
      - ASPNETCORE_HTTP_PORTS=8080
      - services__aiservice__http__0=http://aiservice:8080
      # Optional Entra ID sign-in; register http://localhost:8080/signin-oidc and /signout-callback-oidc as redirect URIs.
      - AzureAd__TenantId
      - AzureAd__ClientId
      - AzureAd__ClientSecret
    networks:
      - agenticlab
    depends_on:
      - aiservice

networks:
  agenticlab:
    driver: bridge
